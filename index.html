<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="css/sim.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>

  </head>
  <body>
    <!-- <h1>EP.SIM.</h1> -->
    <aside id="sidebar" class="sidebar">
      <section id="simControl" class="simControl">
        <button id="minMax" class="iconButton button-active">
          Einstellungen
        </button>
        <button id="simClock" class="iconBtn">00:00:00</button>
      </section>
      <section id="simSettings" class="simSettings">
        <section id="modeControl" class="modeControl">
          <h3>Netzwerkstruktur und Algorithmus</h3>
          <button id="btnA" class="radioBtn button-active_simColor tooltip">Autonomie <span class="tooltiptext">In diesem
          </span></button>
          <button id="btnF" class="radioBtn tooltip">
            Gerechtigkeit
            <span class="tooltiptext">Some tooltip text</span>
          </button>
          <button id="btnE" class="radioBtn tooltip">Empathie <span class="tooltiptext">Some tooltip text</span></button>
        </section>
        <section >
          <h3>Einstellungen</h3>
          <div id="nodeControl" class="nodeControl" >     
               <label for="nodeAmountRange"
            >Aktive Nutzer*innen
            <span id="nodeAmountLabel" class="numLabel">000</span></label
          >
          <input
            type="range"
            name="nodeAmountRange"
            id="nodeAmountRange"
            min="3"
            max="100"
            value="10"
          />
          <label for="connectivityRange"
            >Reichweite
            <span id="connectivityLabel" class="numLabel">000</span></label
          >
          <input
            type="range"
            name="connectivityRange"
            id="connectivityRange"
            min="1"
            max="40"
            value="10"
            oninput="sim.initNodes()"
          />
          <label for="messageRateRange"
            >Nachricht Rate
            <span id="messageRateLabel" class="numLabel">000</span></label
          >
          <input
            type="range"
            name="messageRateRange"
            id="messageRateRange"
            min="1"
            max="100"
            value="10"
            oninput="sim.initNodes()"
          />

          <label for="attentionRange"
            >Aufmerksamkeitsspanne
            <span id="attentionLabel" class="numLabel">000</span></label
          >
          <input
            type="range"
            name="attentionRange"
            id="attentionRange"
            min="1"
            max="100"
            value="20"
            oninput="sim.initNodes()"
          />
          <label for="groupSizeRange"
            >Gruppengröße
            <span id="groupSizeLabel" class="numLabel">000</span></label
          >
          <input
            type="range"
            name="groupSizeRange"
            id="groupSizeRange"
            min="1"
            max="100"
            value="8"
            oninput="sim.initNodes()"
          />
            <label for="groupIntervalRange"
            >Dauer bis zufällige Gruppenbildung
            <span id="groupIntervalLabel" class="numLabel">000</span></label
          >
          <input
            type="range"
            name="groupIntervalRange"
            id="groupIntervalRange"
            min="1"
            max="100"
            value="20"
            oninput="sim.initNodes()"
          />
</div>
       
        </section>
      </section>
    </aside>

    <div class="legende tool"><span class="tooltiptext">Some tooltip text</span>
      <span
        ><h5>Nutzer*innen</h5>
        <div class="ellipse"></div
      ></span>
  <span>
        <h5>Nachrichten</h5>
        <span style="display: flex;">    
          <div class="line"></div>
          <div class="arrow">
          <div class="arm left"></div>
          <div class="arm right"></div>
          </div>
      </span>
    
          </span>
        </div>
  
    </div>
    <div id="canvasContainer" class="canvasContainer"></div>
  </body>
  <footer>    
    <script src="js/main.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/ui.js"></script>
  </footer>
  
</html>
