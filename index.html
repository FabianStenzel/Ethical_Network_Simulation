<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="css/sim.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/ui.js"></script>
  </head>
  <body>
    <aside id="sidebar" class="sidebar">
      <section id="simSettings" class="simSettings">
        <section id="modeControl">
          <h3>App Presets</h3>
          <button id="btnA" class="radioBtn">Fairness</button>
          <button id="btnF" class="radioBtn">Autonomy</button>
          <button id="btnE" class="radioBtn">Empathy</button>
        </section>
        <section id="nodeControl">
          <h3>Node Settings</h3>
          <h4>Node Amount</h4>
          <input
            type="range"
            name=""
            id="nodeAmountRange"
            min="0"
            max="500"
            value="10"
            oninput="sim.initNodes()"
          />
          <h4>Connectivity</h4>
          <input
            type="range"
            name=""
            id="connectivityRange"
            min="1"
            max="40"
            value="10"
            oninput="sim.initNodes()"
          />
          <h4>Message Rate</h4>
          <input
            type="range"
            name=""
            id="messageRateRange"
            min="1"
            max="20000"
            value="10000"
            oninput="sim.initNodes()"
          />
          <h4>Attention Span</h4>
          <input
            type="range"
            name=""
            id="attentionRange"
            min="0"
            max="120"
            value="20"
            oninput="sim.initNodes()"
          />
        </section>
      </section>
      <section id="simControl" class="simControl">
        <button id="minMax" class="iconButton">Min/Max</button>
        <button class="iconBtn" onclick="sim.initNodes()">Restart</button>
        <button class="iconBtn">Play/Pause</button>
        <button class="iconBtn">1x</button>
        <span id="simClock" style="padding: 20px"> 00:00:00 </span>
      </section>
    </aside>
    <div id="canvasContainer" class="canvasContainer"></div>
  </body>
</html>
