<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="css/sim.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/ui.js"></script>
  </head>
  <body>
    <aside id="sidebar" class="sidebar">
      <section id="simSettings" class="simSettings">
        <section id="modeControl">
          <h3>App Presets</h3>
          <button id="btnA" class="radioBtn button-active">Fairness</button>
          <button id="btnF" class="radioBtn">Autonomy</button>
          <button id="btnE" class="radioBtn">Empathy</button>
        </section>
        <section id="nodeControl">
          <h3>Settings</h3>
          <label for="nodeAmountRange"
            >Active Users
            <span id="nodeAmountLabel" class="numLabel">000</span></label
          >

          <input
            type="range"
            name="nodeAmountRange"
            id="nodeAmountRange"
            min="3"
            max="500"
            value="10"
          />
          <label for="connectivityRange"
            >User Reach
            <span id="connectivityLabel" class="numLabel">000</span></label
          >
          <input
            type="range"
            name="connectivityRange"
            id="connectivityRange"
            min="1"
            max="40"
            value="10"
            oninput="sim.initNodes()"
          />
          <label for="messageRateRange"
            >Posting Rate
            <span id="messageRateLabel" class="numLabel">000</span></label
          >
          <input
            type="range"
            name="messageRateRange"
            id="messageRateRange"
            min="1"
            max="100"
            value="10"
            oninput="sim.initNodes()"
          />
          <label for="attentionRange"
            >Attention Span
            <span id="attentionLabel" class="numLabel">000</span></label
          >
          <input
            type="range"
            name="attentionRange"
            id="attentionRange"
            min="1"
            max="100"
            value="20"
            oninput="sim.initNodes()"
          />
        </section>
      </section>
      <section id="simControl" class="simControl">
        <button id="minMax" class="iconButton">Min/Max</button>
        <button id="timeToggle" class="iconBtn">Play/Pause</button>
        <button id="timeRatio" class="iconBtn">1x</button>
        <span id="simClock" style="padding: 20px"> 00:00:00 </span>
      </section>
    </aside>
    <div id="canvasContainer" class="canvasContainer"></div>
  </body>
</html>
