<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Social Network Simulation — P5.js</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Roboto, Arial;
      }
      #ui {
        position: absolute;
        right: 8px;
        top: 8px;
        width: 300px;
        background: rgba(255, 255, 255, 0.95);
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      }
      #ui label {
        display: block;
        font-size: 12px;
        margin-top: 8px;
      }
      #ui input[type="range"] {
        width: 100%;
      }
      #canvas-holder {
        position: fixed;
        left: 0;
        top: 0;
        right: 320px;
        bottom: 0;
      }
      button,
      select {
        width: 100%;
        margin-top: 8px;
        padding: 6px;
      }
      .small {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="canvas-holder"></div>
    <div id="ui">
      <label>Profile</label>
      <select id="profileSelect">
        <option value="pillar">Pillar (Fairness)</option>
        <option value="why">Why (Autonomie)</option>
        <option value="justask">Just Ask (Empathie)</option>
        <option value="custom">Custom</option>
      </select>

      <label>Users (nodes): <span id="userAmountLabel">40</span></label>
      <input id="userAmount" type="range" min="5" max="200" value="40" />

      <label
        >User connectivity (tendency to have many edges):
        <span id="connectivityLabel">0.6</span></label
      >
      <input
        id="connectivity"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.6"
      />

      <label>Homophily (0..1): <span id="homophilyLabel">0.5</span></label>
      <input
        id="homophily"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.5"
      />

      <label>Message decay (seconds): <span id="decayLabel">10</span></label>
      <input id="decay" type="range" min="1" max="120" step="1" value="10" />

      <label
        >Time ratio (real time → 1s = 1h):
        <span id="timeRatioLabel">1x</span></label
      >
      <input
        id="timeRatio"
        type="range"
        min="1"
        max="3600"
        step="1"
        value="1"
      />

      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
      <div class="small">
        Click a node to pin/unpin. Drag background to pan. Scroll to zoom.
      </div>
      <div id="simClock" style="margin-top: 6px; font-weight: 600">
        00:00:00
      </div>
    </div>

    <script>
      let sim;

      function setup() {
        createCanvas(windowWidth - 320, windowHeight).parent("canvas-holder");
        sim = new Simulation();
        setupUI();
      }

      function windowResized() {
        resizeCanvas(windowWidth - 320, windowHeight);
      }

      function draw() {
        background(245);
        sim.update();
        sim.draw();
        sim.updateClock();
      }

      class Node {
        constructor(id, x, y) {
          this.id = id;
          this.pos = createVector(x, y);
          this.vel = createVector();
          this.acc = createVector();
          this.radius = 10;
        }
      }

      class Message {
        constructor(from, to, createdAt, lifetime) {
          this.from = from;
          this.to = to;
          this.createdAt = createdAt;
          this.lifetime = lifetime;
        }
        alive(simTime) {
          return simTime - this.createdAt < this.lifetime;
        }
      }

      class Simulation {
        constructor() {
          this.nodes = [];
          this.messages = [];
          this.edges = {};
          this.simTime = 0;
          this.timeRatio = 1;
          this.paused = false;
          this.lastTick = millis() / 1000;

          this.settings = {
            userAmount: 40,
            connectivity: 0.6,
            homophily: 0.5,
            decay: 10,
            profile: "pillar",
          };

          this.pillarSchedule = {
            period: 24 * 60 * 60,
            scheduled: [],
            nextWindowStart: 0,
          };
          this._pillarCollected = [];

          this.initNodes();

          // Initial Pillar messages
          if (this.settings.profile === "pillar") {
            const minPosts = max(1, floor(this.settings.userAmount * 0.05));
            const maxPosts = max(
              minPosts,
              floor(this.settings.userAmount * 0.4)
            );
            const initialCount = floor(random(minPosts, maxPosts));
            const ids = shuffle(this.nodes.map((n) => n.id));
            this._pillarCollected = ids.slice(0, initialCount);
          }
        }

        initNodes() {
          this.nodes = [];
          for (let i = 0; i < this.settings.userAmount; i++) {
            this.nodes.push(new Node(i, random(width), random(height)));
          }
          this.messages = [];
          this.edges = {};
        }

        addMessage(from, toArray, lifetime) {
          this.messages.push(
            new Message(from, toArray, this.simTime, lifetime * this.timeRatio)
          );
          for (let t of toArray) {
            this.edges[`${from}|${t}`] = 1;
          }
        }

        stepBehavior(dt) {
          if (this.settings.profile === "pillar") {
            const period = this.pillarSchedule.period;
            if (this.simTime >= this.pillarSchedule.nextWindowStart + period) {
              const posts = this._pillarCollected.slice();
              this._pillarCollected = [];
              const count = max(1, posts.length);
              const window = period / count;
              for (let i = 0; i < posts.length; i++) {
                const scheduledTime =
                  this.pillarSchedule.nextWindowStart + random(0, period);
                this.pillarSchedule.scheduled.push({
                  when: scheduledTime,
                  from: posts[i],
                  lifetime: window,
                });
              }
              this.pillarSchedule.nextWindowStart += period;
            }
            let remaining = [];
            for (let s of this.pillarSchedule.scheduled) {
              if (s.when <= this.simTime) {
                // Remove all previous messages before new one
                this.messages = [];
                this.edges = {};
                this.addMessage(
                  s.from,
                  this.nodes.map((n) => n.id),
                  s.lifetime
                );
              } else remaining.push(s);
            }
            this.pillarSchedule.scheduled = remaining;
          }
        }

        physics(dt) {
          /* add physics code */
        }
        cleanupMessages() {
          /* remove expired messages */
        }
        update() {
          let now = millis() / 1000;
          let dt = now - this.lastTick;
          this.lastTick = now;
          dt *= this.timeRatio;
          if (!this.paused) {
            this.stepBehavior(dt);
            this.physics(dt);
            this.cleanupMessages();
            this.simTime += dt;
            this.simTime %= 24 * 3600;
          }
        }

        draw() {
          for (let m of this.messages) {
            stroke(0, 50);
            for (let t of m.to) {
              line(
                this.nodes[m.from].pos.x,
                this.nodes[m.from].pos.y,
                this.nodes[t].pos.x,
                this.nodes[t].pos.y
              );
            }
          }
          fill(100, 150, 255);
          noStroke();
          for (let n of this.nodes) {
            ellipse(n.pos.x, n.pos.y, n.radius * 2);
          }
        }

        updateClock() {
          const t = floor(this.simTime);
          const h = floor(t / 3600);
          const m = floor((t % 3600) / 60);
          const s = t % 60;
          const pad = (v) => v.toString().padStart(2, "0");
          document.getElementById("simClock").innerText = `${pad(h)}:${pad(
            m
          )}:${pad(s)}`;
        }
      }

      function setupUI() {
        document
          .getElementById("profileSelect")
          .addEventListener(
            "change",
            (e) => (sim.settings.profile = e.target.value)
          );
        const ua = document.getElementById("userAmount");
        const uaL = document.getElementById("userAmountLabel");
        ua.addEventListener("input", (e) => {
          sim.settings.userAmount = parseInt(e.target.value);
          uaL.innerText = e.target.value;
          sim.initNodes();
        });
        const con = document.getElementById("connectivity");
        const conL = document.getElementById("connectivityLabel");
        con.addEventListener("input", (e) => {
          sim.settings.connectivity = parseFloat(e.target.value);
          conL.innerText = e.target.value;
        });
        const hom = document.getElementById("homophily");
        const homL = document.getElementById("homophilyLabel");
        hom.addEventListener("input", (e) => {
          sim.settings.homophily = parseFloat(e.target.value);
          homL.innerText = e.target.value;
        });
        const decay = document.getElementById("decay");
        const decayL = document.getElementById("decayLabel");
        decay.addEventListener("input", (e) => {
          sim.settings.decay = parseInt(e.target.value);
          decayL.innerText = e.target.value;
        });
        const tr = document.getElementById("timeRatio");
        const trL = document.getElementById("timeRatioLabel");
        tr.addEventListener("input", (e) => {
          sim.timeRatio = parseFloat(e.target.value);
          trL.innerText =
            e.target.value == 3600 ? "1s = 1h" : e.target.value + "x";
        });
        document.getElementById("pauseBtn").addEventListener("click", () => {
          sim.paused = !sim.paused;
          document.getElementById("pauseBtn").innerText = sim.paused
            ? "Resume"
            : "Pause";
        });
        document.getElementById("resetBtn").addEventListener("click", () => {
          sim.initNodes();
        });
      }
    </script>
  </body>
</html>
